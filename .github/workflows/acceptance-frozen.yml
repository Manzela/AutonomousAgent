# SP-00e — acceptance-frozen gate (Executor Contract C8/C10).
#
# Recomputes the sha of every audit/acceptance/*.yaml and fails the PR on drift from
# the CODEOWNERS-guarded manifest audit/acceptance/SHA256SUMS — so a PR cannot quietly
# move its own acceptance goalposts. Also re-runs the SP-00e.1 acceptance assertions
# (C1: evidence = re-run) and the gate's own unit tests, and uploads the evidence.
#
# This is gate-config; CODEOWNERS guards .github/ + audit/acceptance/, so this workflow
# and the manifest are reviewed by the operator + the cross-vendor (Gemini) reviewer (C9).
name: acceptance-frozen

on:
  pull_request:
    branches: [main, "remediation/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  acceptance-frozen:
    name: Verify acceptance files match the sha-pinned manifest (C8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0

      - name: acceptance-frozen — manifest integrity (C8)
        run: |
          set -uo pipefail
          python3 scripts/ci/acceptance_frozen.py | tee acceptance-frozen-evidence.txt
          status=${PIPESTATUS[0]}
          {
            echo "### acceptance-frozen (CI-produced, C8)"
            echo '```'
            cat acceptance-frozen-evidence.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Re-run SP-00e.1 acceptance assertions (C1)
        run: |
          set -uo pipefail
          uv run --no-project --with pyyaml \
            python scripts/ci/run_acceptance.py audit/acceptance/SP-00e.1.yaml \
            | tee -a acceptance-frozen-evidence.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests for the gate (committed red-green pair)
        run: |
          set -uo pipefail
          uv run --no-project --with pytest \
            python -m pytest tests/ci/test_acceptance_frozen.py -q \
            | tee -a acceptance-frozen-evidence.txt
          exit ${PIPESTATUS[0]}

      - name: Upload acceptance-frozen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: acceptance-frozen-evidence
          path: acceptance-frozen-evidence.txt
          if-no-files-found: error
