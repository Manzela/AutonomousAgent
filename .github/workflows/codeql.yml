# CodeQL — static analysis for Python (NIST SSDF PW.7).
#
# Runs on every PR to main plus a weekly schedule to catch new query packs
# released since the last PR. Detection-only — findings land in the
# repository's Security tab (Code Scanning > CodeQL) so the team can
# triage on their own schedule rather than blocking merges on pre-existing
# advisories.
#
# Languages: python only. JavaScript is intentionally omitted because the
# repo contains zero JS at the time of writing; bring it back when a
# frontend lands. Adding unused languages costs ~3min/run for no signal.

name: CodeQL

on:
  workflow_dispatch:

# Cancel superseded PR runs.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF results
  actions: read            # required by codeql-action

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        language: [python]

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v3
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/python p/security-audit p/owasp-top-ten p/jwt
