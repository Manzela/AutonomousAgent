# SP-00e.5 — dead-code reachability gate (Executor Contract C4).
#
# Every public function/class ADDED or whose BODY CHANGED must have ≥1 call site
# REACHABLE FROM A RUNTIME ENTRYPOINT (bare import/re-export does NOT count),
# proven by an AST callgraph. No @manual self-waiver allowed.
#
# Anti-pattern killed: dead code shipped as ticked boxes.
#
# Check name: "dead-code reachability (C4)"
# CODEOWNERS guards .github/, so this gate-config is reviewed by the operator + Gemini (C9).
name: dead-code-gate

on:
  pull_request:
    branches: [main, "remediation/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dead-code-reachability:
    name: dead-code reachability (C4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0

      - name: uv sync --frozen (runtime extras only; dev excluded)
        run: uv sync --frozen --extra a2a --extra gcp

      - name: Run dead-code reachability gate (C4)
        # Feeds `git diff origin/${{ github.base_ref }}...HEAD` via stdin ('-').
        # Gate is stdlib-only (ast module); no third-party deps needed.
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | \
            python scripts/ci/dead_code_gate.py --diff -

      - name: Re-run SP-00e.5 acceptance (C1 evidence = re-run)
        run: |
          uv run --no-project --with pyyaml \
            python scripts/ci/run_acceptance.py audit/acceptance/SP-00e.5.yaml

      - name: Gate machinery unit tests (committed red-green)
        run: |
          uv run --no-project --with pytest \
            python -m pytest tests/ci/test_dead_code_gate.py -q
