# SP-06 — PRD conformance evaluation gate.
#
# Runs on every PR to main or remediation/**:
# Executes the PRD conformance regression test suite using the DeepEval DAGMetric.
name: eval-gate

on:
  pull_request:
    branches: [main, "remediation/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prd-conformance-eval:
    name: PRD Conformance Eval (SP-06)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run PRD Conformance Evaluation
        run: |
          set -uo pipefail
          export PYTHONPATH=.
          export OTEL_TRACES_EXPORTER=none
          export OTEL_METRICS_EXPORTER=none
          uv run pytest evals/prd_conformance.py -q | tee prd-conformance-evidence.txt
          exit ${PIPESTATUS[0]}

      - name: Upload PRD Conformance Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: prd-conformance-evidence
          path: prd-conformance-evidence.txt
          if-no-files-found: error
