name: No new skip/skipif/xfail/manual markers (C6)
on:
  pull_request:
    branches: [main, "remediation/**"]
    paths: ['tests/**', 'lib/**', 'app/**']
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
      - name: Block new skip/skipif/xfail/manual markers (C6)
        run: |
          set -uo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # C6: "a test that can't run in CI keeps its task OPEN." Block NEWLY-ADDED skip
          # markers (skip/skipif/xfail) and the forbidden @manual / pytest.mark.manual.
          # Forward-looking (added lines only) — the 18 pre-existing markers are unaffected.
          ADDED=$(git diff "${BASE_SHA}...${HEAD_SHA}" --diff-filter=AM -- '*.py' \
                  | grep -E '^\+[^+].*(pytest\.mark\.(skip|skipif|xfail)|@manual|pytest\.mark\.manual)' || true)
          if [ -n "$ADDED" ]; then
            echo "::error::PR adds skip/skipif/xfail/manual markers (C6 forbids new skips):"
            echo "$ADDED"
            exit 1
          fi
