name: OSV Scanner
on:
  pull_request:
    branches: [main]
    paths: ['pyproject.toml', 'uv.lock']
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday catch-up
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
    with:
      scan-args: |-
        --lockfile=uv.lock
        --fail-on-vuln
