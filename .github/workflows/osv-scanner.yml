name: OSV Scanner
on:
  pull_request:
    branches: [main]
    paths: ['pyproject.toml', 'uv.lock']
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday catch-up
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1  # v2.5.0
    with:
      scan-args: |-
        --lockfile=uv.lock
        --fail-on-vuln
