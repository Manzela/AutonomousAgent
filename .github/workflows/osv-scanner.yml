name: OSV Scanner
on:
  pull_request:
    branches: [main]
    paths: ['pyproject.toml', 'uv.lock']
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday catch-up
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
    with:
      scan-args: |-
        --lockfile=uv.lock
        --fail-on-vuln
