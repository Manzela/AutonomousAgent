# Phase 0a — GCP Deployment Pipeline
#
# Builds the two custom images (hermes, shell-sandbox) and deploys them to
# the autonomousagent-vm GCE instance via IAP SSH. No JSON service-account
# keys — authentication uses Workload Identity Federation with the
# autonomousagent-github CI SA.
#
# Trigger: push to main when deploy-affecting files change (see paths filter).
#
# Jobs:
#   build-and-push   Build linux/amd64 images → push to Artifact Registry
#   deploy           IAP SSH → pull new images → restart compose stack
#
# AC-7 constraint: total runtime ≤ 10 minutes.
#
# Required GitHub repository variables:
#   GCP_WIF_PROVIDER  — full WIF provider resource name
#   GCP_DEPLOYER_SA   — CI service account email
#
# Both are set as repository Variables (not Secrets) because they are not
# sensitive and can appear in workflow logs without risk.
#
# SHA-pinning policy: every `uses:` reference MUST be pinned to a 40-char
# commit SHA. See scripts/check-sha-pinning.sh and
# docs/runbooks/allowed-actions-restriction.md.

name: Phase 0a Deploy

on:
  push:
    branches: [main]
    paths:
      # Docker image sources
      - "deploy/Dockerfile.hermes"
      - "deploy/sandboxes/Dockerfile.shell-sandbox"
      # Compose stack
      - "deploy/docker-compose.yml"
      # Terraform (infra changes may need a re-deploy to pick up new SA bindings, etc.)
      - "terraform/phase-0a-gcp/**"
      # The workflow itself
      - ".github/workflows/phase-0a-deploy.yml"
  # Allow manual trigger for rollback / forced redeploy
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (logged in summary)"
        required: false
        default: "manual trigger"

# Prevent two deployments running simultaneously. The second run waits;
# cancel-in-progress: false ensures an in-flight deploy is never killed mid-way,
# which would leave the stack in an inconsistent state.
concurrency:
  group: phase-0a-deploy-${{ github.ref }}
  cancel-in-progress: false

# Minimal permissions at workflow level; jobs add what they need.
permissions:
  contents: read

env:
  GCP_PROJECT: autonomous-agent-2026
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  VM_NAME: autonomousagent-vm
  AR_REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: us-central1-docker.pkg.dev/autonomous-agent-2026/autonomousagent-images
  BOOTSTRAP_TARBALL: gs://autonomous-agent-2026-snapshots/bootstrap/hermes-bootstrap.tar.gz
  # Target container count for smoke-check (matches the compose stack)
  EXPECTED_CONTAINER_COUNT: 10

jobs:
  # ------------------------------------------------------------------
  # Build both images for linux/amd64 and push to Artifact Registry.
  # GCE is x86_64; multi-platform emulation is not used.
  # ------------------------------------------------------------------
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    timeout-minutes: 7

    permissions:
      contents: read
      id-token: write   # required by google-github-actions/auth for WIF OIDC

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      hermes_digest: ${{ steps.build_hermes.outputs.digest }}
      sandbox_digest: ${{ steps.build_sandbox.outputs.digest }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # hermes-agent submodule required: Dockerfile.hermes COPYs
          # hermes-agent/pyproject.toml and hermes-agent/uv.lock at build time.
          submodules: true

      # ------------------------------------------------------------------
      # Authenticate to GCP via Workload Identity Federation.
      # token_format: access_token produces a short-lived OAuth2 token that
      # docker/login-action can use directly — no gcloud CLI call needed.
      # ------------------------------------------------------------------
      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      # ------------------------------------------------------------------
      # Set up Docker Buildx. The docker-container driver is required for
      # --platform linux/amd64 cross-build and build cache export.
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # ------------------------------------------------------------------
      # Log in to Artifact Registry using the short-lived access token
      # minted by google-github-actions/auth above.
      # ------------------------------------------------------------------
      - name: Log in to Artifact Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.AR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ------------------------------------------------------------------
      # Derive the image tag from the git SHA (first 12 chars) so every
      # push produces an immutable, traceable tag.
      # ------------------------------------------------------------------
      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHORT_SHA}"

      # ------------------------------------------------------------------
      # Build and push hermes image.
      # Cache: GitHub Actions cache (type=gha) with a per-image scope so
      # hermes and shell-sandbox don't collide. type=gha writes no tags to
      # AR, which is required because immutable_tags=true is repo-scoped
      # and would reject any `:buildcache` overwrite on the second build.
      # ------------------------------------------------------------------
      - name: Build and push hermes
        id: build_hermes
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/Dockerfile.hermes
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_REPO }}/hermes:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=hermes
          cache-to: type=gha,mode=max,scope=hermes
          provenance: mode=max
          sbom: true

      # ------------------------------------------------------------------
      # Build and push shell-sandbox image.
      # ------------------------------------------------------------------
      - name: Build and push shell-sandbox
        id: build_sandbox
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/sandboxes/Dockerfile.shell-sandbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_REPO }}/shell-sandbox:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=shell-sandbox
          cache-to: type=gha,mode=max,scope=shell-sandbox
          provenance: mode=max
          sbom: true

      # ------------------------------------------------------------------
      # Sign both images with cosign keyless OIDC (P2-23).
      # The build-push-action already attaches SLSA provenance + SBOM via
      # buildx attestations. cosign sign binds an additional Sigstore
      # transparency-log entry to the image digest so the deploy job can
      # verify with cosign verify-attestation (fail-CLOSED gate).
      # id-token: write is already granted to this job for WIF auth above.
      # ------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign hermes image
        run: |
          cosign sign --yes \
            "${{ env.AR_REPO }}/hermes@${{ steps.build_hermes.outputs.digest }}"

      - name: Sign shell-sandbox image
        run: |
          cosign sign --yes \
            "${{ env.AR_REPO }}/shell-sandbox@${{ steps.build_sandbox.outputs.digest }}"

      - name: Build summary
        run: |
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| hermes | \`${{ steps.meta.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| shell-sandbox | \`${{ steps.meta.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Supply-chain security scans (Gate checks)
  # ------------------------------------------------------------------
  osv-scanner:
    name: OSV Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=uv.lock
        --fail-on-vuln

  trivy:
    name: Trivy Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.70.0
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}" \
            -o "${TARBALL}"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o checksums.txt
          grep "${TARBALL}" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" trivy
          sudo mv trivy /usr/local/bin/
          trivy version

      - name: Scan hermes image
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --vuln-type os,library \
            "us-central1-docker.pkg.dev/autonomous-agent-2026/autonomousagent-images/hermes@${{ needs.build-and-push.outputs.hermes_digest }}"

      - name: Scan shell-sandbox image
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --vuln-type os,library \
            "us-central1-docker.pkg.dev/autonomous-agent-2026/autonomousagent-images/shell-sandbox@${{ needs.build-and-push.outputs.sandbox_digest }}"

  # ------------------------------------------------------------------
  # Deploy to Staging (IAP SSH)
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging (IAP SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push, osv-scanner, trivy]
    environment:
      name: staging
      url: https://autonomousagent-staging-vm.autonomous-agent-2026.cloud.goog

    permissions:
      contents: read
      id-token: write   # WIF

    env:
      VM_NAME: autonomousagent-staging-vm
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      HERMES_DIGEST: ${{ needs.build-and-push.outputs.hermes_digest }}
      SANDBOX_DIGEST: ${{ needs.build-and-push.outputs.sandbox_digest }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          submodules: false

      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Set up gcloud CLI
        run: |
          gcloud config set project "$GCP_PROJECT"
          gcloud config set compute/zone "$GCP_ZONE"
          gcloud config set compute/region "$GCP_REGION"
          gcloud auth list

      - name: Log in to Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify image signatures
        env:
          HERMES_IMAGE: ${{ env.AR_REPO }}/hermes@${{ env.HERMES_DIGEST }}
          SANDBOX_IMAGE: ${{ env.AR_REPO }}/shell-sandbox@${{ env.SANDBOX_DIGEST }}
        run: |
          for img in "$HERMES_IMAGE" "$SANDBOX_IMAGE"; do
            echo "Verifying signature for $img..."
            cosign verify \
              --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$img"
          done

      - name: Verify SLSA provenance
        env:
          IMAGE: ${{ env.AR_REPO }}/hermes@${{ env.HERMES_DIGEST }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/.+@refs/heads/main$' \
            "${IMAGE}" \
            | jq -e '.payload | @base64d | fromjson | .predicateType == "https://slsa.dev/provenance/v1"'

      - name: Deploy via IAP SSH
        env:
          HERMES_DIGEST: ${{ env.HERMES_DIGEST }}
          SANDBOX_DIGEST: ${{ env.SANDBOX_DIGEST }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s -- '$IMAGE_TAG' '$HERMES_DIGEST' '$SANDBOX_DIGEST'" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail

          IMAGE_TAG="$1"
          HERMES_DIGEST="$2"
          SANDBOX_DIGEST="$3"

          for digest_var in HERMES_DIGEST SANDBOX_DIGEST; do
            digest_val="${!digest_var}"
            if [[ ! "${digest_val}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "[deploy] ERROR: ${digest_var} has unexpected format: '${digest_val}'" >&2
              exit 1
            fi
          done

          BOOTSTRAP_DIR="/opt/hermes/bootstrap"
          COMPOSE_BASE="${BOOTSTRAP_DIR}/docker-compose.yml"
          COMPOSE_GCP="${BOOTSTRAP_DIR}/docker-compose.gcp.override.yml"
          BOOTSTRAP_TARBALL="gs://autonomous-agent-2026-snapshots/bootstrap/hermes-bootstrap.tar.gz"
          EXPECTED_CONTAINERS=10
          AR_BASE="us-central1-docker.pkg.dev/autonomous-agent-2026/autonomousagent-images"

          echo "[deploy] Refreshing bootstrap tarball from GCS..."
          gsutil -q cp "${BOOTSTRAP_TARBALL}" /tmp/hermes-bootstrap.tar.gz
          tar -xzf /tmp/hermes-bootstrap.tar.gz -C "${BOOTSTRAP_DIR}" 2>/dev/null
          rm -f /tmp/hermes-bootstrap.tar.gz
          echo "[deploy] Bootstrap tarball extracted."

          echo "[deploy] Authenticating Docker to Artifact Registry..."
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

          echo "[deploy] Verifying image signatures and attestations..."
          if ! command -v cosign &> /dev/null; then
            COSIGN_VERSION="v2.4.1"
            echo "Installing cosign ${COSIGN_VERSION} (pinned)..."
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
              -o /tmp/cosign-linux-amd64
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt" \
              -o /tmp/cosign_checksums.txt
            grep "cosign-linux-amd64$" /tmp/cosign_checksums.txt | sha256sum -c -
            chmod +x /tmp/cosign-linux-amd64
            sudo mv /tmp/cosign-linux-amd64 /usr/local/bin/cosign
            rm -f /tmp/cosign_checksums.txt
          fi

          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${AR_BASE}/hermes@${HERMES_DIGEST}"

          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}"

          docker pull "${AR_BASE}/hermes@${HERMES_DIGEST}"
          docker pull "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}"

          docker tag "${AR_BASE}/hermes@${HERMES_DIGEST}" "${AR_BASE}/hermes:${IMAGE_TAG}"
          docker tag "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}" "${AR_BASE}/shell-sandbox:${IMAGE_TAG}"

          docker container prune -f

          docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" \
            up -d --quiet-pull || true

          echo "[deploy] Smoke check — polling up to 120 s for ${EXPECTED_CONTAINERS} containers..."
          for attempt in $(seq 1 12); do
            running=$(docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" \
              ps --status running -q | wc -l | xargs)
            echo "[deploy] t+${attempt}0s: running=${running}/${EXPECTED_CONTAINERS}"
            if [ "${running}" -ge "${EXPECTED_CONTAINERS}" ]; then
              echo "[deploy] Smoke check passed."
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "[deploy] ERROR: timeout — only ${running}/${EXPECTED_CONTAINERS} containers running." >&2
              docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" ps >&2
              exit 1
            fi
            sleep 10
          done

          echo "[deploy] Running deep semantic smoke checks..."
          cd "${BOOTSTRAP_DIR}"
          sudo bash ./scripts/smoke.sh
          REMOTE_SCRIPT

      - name: Deploy summary
        if: success()
        run: |
          echo "### Deploy to Staging complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VM**: \`$VM_NAME\` (\`$GCP_ZONE\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag**: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Containers running**: $EXPECTED_CONTAINER_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: \`${{ github.event_name }}\` by \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback guidance on failure
        if: failure()
        run: |
          echo "### Deploy to Staging FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To rollback manually, SSH to the VM and run:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "gcloud compute ssh $VM_NAME --zone=$GCP_ZONE --project=$GCP_PROJECT --tunnel-through-iap" >> "$GITHUB_STEP_SUMMARY"
          echo "# Then on the VM:" >> "$GITHUB_STEP_SUMMARY"
          echo "sudo docker compose -f /opt/hermes/bootstrap/docker-compose.yml up -d" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Deploy to Production (IAP SSH, manual environment approval gate)
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (IAP SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push, osv-scanner, trivy, deploy-staging]
    environment:
      name: production
      url: https://autonomousagent-vm.autonomous-agent-2026.cloud.goog

    permissions:
      contents: read
      id-token: write   # WIF

    env:
      VM_NAME: autonomousagent-vm
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      HERMES_DIGEST: ${{ needs.build-and-push.outputs.hermes_digest }}
      SANDBOX_DIGEST: ${{ needs.build-and-push.outputs.sandbox_digest }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          submodules: false

      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Set up gcloud CLI
        run: |
          gcloud config set project "$GCP_PROJECT"
          gcloud config set compute/zone "$GCP_ZONE"
          gcloud config set compute/region "$GCP_REGION"
          gcloud auth list

      - name: Log in to Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify image signatures
        env:
          HERMES_IMAGE: ${{ env.AR_REPO }}/hermes@${{ env.HERMES_DIGEST }}
          SANDBOX_IMAGE: ${{ env.AR_REPO }}/shell-sandbox@${{ env.SANDBOX_DIGEST }}
        run: |
          for img in "$HERMES_IMAGE" "$SANDBOX_IMAGE"; do
            echo "Verifying signature for $img..."
            cosign verify \
              --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$img"
          done

      - name: Verify SLSA provenance
        env:
          IMAGE: ${{ env.AR_REPO }}/hermes@${{ env.HERMES_DIGEST }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/.+@refs/heads/main$' \
            "${IMAGE}" \
            | jq -e '.payload | @base64d | fromjson | .predicateType == "https://slsa.dev/provenance/v1"'

      - name: Deploy via IAP SSH
        env:
          HERMES_DIGEST: ${{ env.HERMES_DIGEST }}
          SANDBOX_DIGEST: ${{ env.SANDBOX_DIGEST }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s -- '$IMAGE_TAG' '$HERMES_DIGEST' '$SANDBOX_DIGEST'" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail

          IMAGE_TAG="$1"
          HERMES_DIGEST="$2"
          SANDBOX_DIGEST="$3"

          for digest_var in HERMES_DIGEST SANDBOX_DIGEST; do
            digest_val="${!digest_var}"
            if [[ ! "${digest_val}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "[deploy] ERROR: ${digest_var} has unexpected format: '${digest_val}'" >&2
              exit 1
            fi
          done

          BOOTSTRAP_DIR="/opt/hermes/bootstrap"
          COMPOSE_BASE="${BOOTSTRAP_DIR}/docker-compose.yml"
          COMPOSE_GCP="${BOOTSTRAP_DIR}/docker-compose.gcp.override.yml"
          BOOTSTRAP_TARBALL="gs://autonomous-agent-2026-snapshots/bootstrap/hermes-bootstrap.tar.gz"
          EXPECTED_CONTAINERS=10
          AR_BASE="us-central1-docker.pkg.dev/autonomous-agent-2026/autonomousagent-images"

          echo "[deploy] Refreshing bootstrap tarball from GCS..."
          gsutil -q cp "${BOOTSTRAP_TARBALL}" /tmp/hermes-bootstrap.tar.gz
          tar -xzf /tmp/hermes-bootstrap.tar.gz -C "${BOOTSTRAP_DIR}" 2>/dev/null
          rm -f /tmp/hermes-bootstrap.tar.gz
          echo "[deploy] Bootstrap tarball extracted."

          echo "[deploy] Authenticating Docker to Artifact Registry..."
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

          echo "[deploy] Verifying image signatures and attestations..."
          if ! command -v cosign &> /dev/null; then
            COSIGN_VERSION="v2.4.1"
            echo "Installing cosign ${COSIGN_VERSION} (pinned)..."
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
              -o /tmp/cosign-linux-amd64
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt" \
              -o /tmp/cosign_checksums.txt
            grep "cosign-linux-amd64$" /tmp/cosign_checksums.txt | sha256sum -c -
            chmod +x /tmp/cosign-linux-amd64
            sudo mv /tmp/cosign-linux-amd64 /usr/local/bin/cosign
            rm -f /tmp/cosign_checksums.txt
          fi

          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${AR_BASE}/hermes@${HERMES_DIGEST}"

          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Manzela/AutonomousAgent/\.github/workflows/phase-0a-deploy\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}"

          docker pull "${AR_BASE}/hermes@${HERMES_DIGEST}"
          docker pull "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}"

          docker tag "${AR_BASE}/hermes@${HERMES_DIGEST}" "${AR_BASE}/hermes:${IMAGE_TAG}"
          docker tag "${AR_BASE}/shell-sandbox@${SANDBOX_DIGEST}" "${AR_BASE}/shell-sandbox:${IMAGE_TAG}"

          docker container prune -f

          docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" \
            up -d --quiet-pull || true

          echo "[deploy] Smoke check — polling up to 120 s for ${EXPECTED_CONTAINERS} containers..."
          for attempt in $(seq 1 12); do
            running=$(docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" \
              ps --status running -q | wc -l | xargs)
            echo "[deploy] t+${attempt}0s: running=${running}/${EXPECTED_CONTAINERS}"
            if [ "${running}" -ge "${EXPECTED_CONTAINERS}" ]; then
              echo "[deploy] Smoke check passed."
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "[deploy] ERROR: timeout — only ${running}/${EXPECTED_CONTAINERS} containers running." >&2
              docker compose -f "${COMPOSE_BASE}" -f "${COMPOSE_GCP}" ps >&2
              exit 1
            fi
            sleep 10
          done

          echo "[deploy] Running deep semantic smoke checks..."
          cd "${BOOTSTRAP_DIR}"
          sudo bash ./scripts/smoke.sh
          REMOTE_SCRIPT

      - name: Deploy summary
        if: success()
        run: |
          echo "### Deploy to Production complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VM**: \`$VM_NAME\` (\`$GCP_ZONE\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag**: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Containers running**: $EXPECTED_CONTAINER_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: \`${{ github.event_name }}\` by \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- **Reason**: ${{ github.event.inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rollback guidance on failure
        if: failure()
        run: |
          echo "### Deploy to Production FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To rollback manually, SSH to the VM and run:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "gcloud compute ssh $VM_NAME --zone=$GCP_ZONE --project=$GCP_PROJECT --tunnel-through-iap" >> "$GITHUB_STEP_SUMMARY"
          echo "# Then on the VM:" >> "$GITHUB_STEP_SUMMARY"
          echo "sudo docker compose -f /opt/hermes/bootstrap/docker-compose.yml up -d" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
