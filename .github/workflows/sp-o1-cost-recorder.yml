# SP-O1 — llm.call.cost histogram .record()ed, SOURCED from the LiteLLM pricing map.
#
# The histogram was created in lib/observability but never recorded; this gate re-runs
# the SP-O1 acceptance red-greens: sourced pricing (non-zero for a priced model),
# NO fabrication (None for an unpriced model), and the end-to-end record wiring.
# The live "non-zero in Cloud Monitoring after a real run" datapoint is a GATED operator
# step (real traffic), not run here.
#
# CODEOWNERS guards .github/ + audit/acceptance/, so this is reviewed by the operator +
# the cross-vendor (Gemini) reviewer (C9).
name: sp-o1-cost-recorder

on:
  pull_request:
    branches: [main, "remediation/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cost-recorder:
    name: llm.call.cost sourced + recorded (SP-O1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0

      - name: Re-run SP-O1 acceptance (sourced-pricing + no-fabrication + record wiring)
        run: |
          uv run --no-project --with pyyaml \
            python scripts/ci/run_acceptance.py audit/acceptance/SP-O1.yaml

      - name: Observability suite (no regression on the cost wiring)
        run: |
          uv run --no-project --with pytest --with litellm --with opentelemetry-sdk \
            python -m pytest tests/unit/test_observability_plugin.py -q
