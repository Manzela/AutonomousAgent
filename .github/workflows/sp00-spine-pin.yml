# SP-00 — Pin the spine: CI-produced acceptance proof (Executor Contract C1).
#
# The AUTHORITATIVE evidence for SP-00 is produced HERE by re-running every
# assertion in audit/acceptance/SP-00.yaml (executor-pasted numbers are advisory).
# This is a per-task verification workflow, NOT a gate-config edit — SP-00e builds
# the generalized pr-meta-checks/acceptance-frozen enforcement. CODEOWNERS guards
# .github/, so this file is reviewed by the operator + the cross-vendor (Gemini)
# reviewer before it can land.
name: SP-00 Spine Pin Acceptance

on:
  pull_request:
    branches: [main, "remediation/**"]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/ci/run_acceptance.py
      - scripts/ci/sp00_garak_removal_probe.sh
      - audit/acceptance/SP-00.yaml
      - .github/workflows/sp00-spine-pin.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sp00-acceptance:
    name: Re-run SP-00 acceptance (resolution + import proof)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Re-run SP-00 acceptance (C1)
        env:
          SP00_IMPORT_PROOF: "1"   # faithful PRD assertion: import langgraph w/o garak
          SP00_UV_FLAGS: ""        # network ON in CI (registry egress is allowlisted, C16)
        run: |
          set -uo pipefail
          # Honest exit-code capture — never mask the runner's status behind a pipe.
          uv run --no-project --with pyyaml \
            python scripts/ci/run_acceptance.py audit/acceptance/SP-00.yaml \
            > sp00-acceptance-evidence.txt 2>&1
          status=$?
          cat sp00-acceptance-evidence.txt
          {
            echo "### SP-00 acceptance (CI-produced, C1)"
            echo '```'
            grep -E '^\[(PASS|FAIL)\]|^== overall' sp00-acceptance-evidence.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload acceptance evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sp00-acceptance-evidence
          path: sp00-acceptance-evidence.txt
          if-no-files-found: error
