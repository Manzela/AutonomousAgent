# Acceptance — N-03 · hermetic cosign verify negative red-green
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# Assertions are self-contained structural checks — they confirm the test exists
# and that the negative (RED) assertion is present verbatim.  Full execution
# requires docker + cosign; these assertions are intentionally static/fast so CI
# can run them without the live infra (the pytest suite carries the live proof).
#
# Source: meta-audit finding N-03 (tests/ci/test_sp00d_cosign_gate.py only asserts
# YAML strings; the negative path — verify MUST fail on unsigned — was unproven).

task: N-03
title: "hermetic cosign verify negative red-green — unsigned image provably rejected"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  - id: test-file-exists
    description: >
      The hermetic cosign verify integration test file must exist at the expected
      path.  Missing == the remediation was never committed.
    cmd: |
      test -f tests/integration/test_cosign_verify_negative.py \
        && echo "OK: test_cosign_verify_negative.py is present" \
        || { echo "FAIL: test_cosign_verify_negative.py is missing"; exit 1; }
    expect_exit: 0

  - id: negative-assertion-present
    description: >
      The CRITICAL assertion — that cosign verify returns NON-ZERO on an unsigned image
      — must appear verbatim as a pytest ``assert ... != 0`` inside the test file.
      This assertion is what makes N-03 a real red-green rather than a structural stub.
    cmd: |
      grep -q 'returncode != 0' tests/integration/test_cosign_verify_negative.py \
        && echo "OK: negative assertion (returncode != 0) is present" \
        || { echo "FAIL: negative assertion 'returncode != 0' is missing from test file"; exit 1; }
    expect_exit: 0

  - id: positive-assertion-present
    description: >
      The GREEN leg — cosign verify exits 0 on a correctly-signed image — must also be
      present.  Without it the test proves rejection but not that the mechanism works at all.
    cmd: |
      grep -q 'returncode == 0' tests/integration/test_cosign_verify_negative.py \
        && echo "OK: positive assertion (returncode == 0) is present" \
        || { echo "FAIL: positive assertion 'returncode == 0' is missing from test file"; exit 1; }
    expect_exit: 0

  - id: no-static-skip-markers
    description: >
      C6 forbids newly-added static skip-marker decorators (pytest.mark.skip,
      pytest.mark.skipif, pytest.mark.xfail).  The test must use only runtime
      pytest.skip() calls inside fixtures.
    cmd: |
      # Look for static decorator forms: @pytest.mark.skip / skipif / xfail
      # (allow the word 'skip' in comments or strings like "pytest.skip(")
      if grep -En '^\s*@pytest\.mark\.(skip|skipif|xfail)' \
              tests/integration/test_cosign_verify_negative.py; then
        echo "FAIL: static skip/skipif/xfail marker found — C6 violation"; exit 1
      fi
      echo "OK: no static skip markers (C6 compliant)"
    expect_exit: 0

  - id: skips-yaml-updated
    description: >
      Both test node-ids for N-03 must be documented in tests/integration/SKIPS.yaml
      with issue: N-03 so the skip-documentation gate passes when docker/cosign are
      absent in CI.
    cmd: |
      grep -q 'test_cosign_verify_negative.py::test_signed_image_verify_passes' \
              tests/integration/SKIPS.yaml \
        || { echo "FAIL: test_signed_image_verify_passes not in SKIPS.yaml"; exit 1; }
      grep -q 'test_cosign_verify_negative.py::test_unsigned_image_verify_fails' \
              tests/integration/SKIPS.yaml \
        || { echo "FAIL: test_unsigned_image_verify_fails not in SKIPS.yaml"; exit 1; }
      grep -q 'issue: N-03' tests/integration/SKIPS.yaml \
        || { echo "FAIL: issue: N-03 not found in SKIPS.yaml"; exit 1; }
      echo "OK: both N-03 node-ids documented in SKIPS.yaml"
    expect_exit: 0

  - id: runtime-skip-fixture-present
    description: >
      The autouse fixture that performs the runtime skip (the C6-compliant mechanism)
      must be present in the test file.
    cmd: |
      grep -q '_require_docker_and_cosign' \
              tests/integration/test_cosign_verify_negative.py \
        && echo "OK: _require_docker_and_cosign autouse fixture is present" \
        || { echo "FAIL: runtime skip fixture '_require_docker_and_cosign' is missing"; exit 1; }
    expect_exit: 0

proof:
  integration_test: tests/integration/test_cosign_verify_negative.py
  artifact: >
    hermetic cosign verify negative red-green: local registry + ephemeral keypair +
    signed image (verify exits 0) + unsigned image (verify exits non-zero).
    Proves the supply-chain gate rejects tampered/unsigned images.
