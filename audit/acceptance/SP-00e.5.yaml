  - id: fix5-triple-quote-comment-decoy-does-not-bypass-waiver
    description: >
      FIX 5 (self-waiver comment evasion): a # \"\"\" comment line must NOT toggle the
      triple-string tracker. A subsequent @manual on an added line → still HARD fail.
      The bug: old code counted triple-quotes in comments, flipping the state and
      treating the @manual line as inside a triple-string (skipped — waiver evaded).
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import evaluate

      code = '# """\n@manual\ndef evaded_fn():\n    return "evaded"\n'
      ep = "if __name__ == '__main__':\n    pass\n"
      files = {"app/evade_mod.py": code, "app/entry.py": ep}
      diff_lines = [
          'diff --git a/app/evade_mod.py b/app/evade_mod.py',
          '--- a/app/evade_mod.py',
          '+++ b/app/evade_mod.py',
          '@@ -0,0 +1,4 @@',
          '+# """',
          '+@manual',
          '+def evaded_fn():',
          '+    return "evaded"',
      ]
      diff = "\n".join(diff_lines) + "\n"
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if r.ok:
          print("FAIL: @manual must be caught even after # \"\"\" decoy"); sys.exit(1)
      combined = " ".join(r.hard_failures).lower()
      if "manual" not in combined and "waiver" not in combined:
          print("FAIL: failure must mention @manual/self-waiver:", r.hard_failures); sys.exit(1)
      print("OK: @manual correctly caught despite # \"\"\" decoy:", r.hard_failures[0])
      PYEOF
    expect_exit: 0

