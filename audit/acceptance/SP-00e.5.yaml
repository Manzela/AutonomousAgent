  - id: relative-import-init-resolution
    description: >
      FIX C: `from . import utils` in app/core/__init__.py must resolve to app.core.utils,
      not app.utils. Before FIX C, level-1 stripped one segment from 'app.core' to get
      base='app', producing the wrong 'app.utils'. After FIX C, __init__.py files are
      detected and level-1 keeps all segments (base='app.core'), giving 'app.core.utils'.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import build_callgraph

      init_code = "from . import utils\n"
      utils_code = "def util_fn():\n    return 42\n"
      ep_code = "import app.core\n\nif __name__ == '__main__':\n    pass\n"
      files = {
          "app/core/__init__.py": init_code,
          "app/core/utils.py": utils_code,
          "app/entry.py": ep_code,
      }
      graph = build_callgraph(list(files.keys()), lambda p: files[p])
      core_edges = graph.get("app.core:<module>", set())
      if "app.core.utils:<module>" not in core_edges:
          print("FAIL: __init__.py relative import must resolve to app.core.utils, not app.utils")
          print("  app.core:<module> edges:", sorted(core_edges)); sys.exit(1)
      if "app.utils:<module>" in core_edges:
          print("FAIL: old bug — import resolved to wrong parent app.utils")
          print("  app.core:<module> edges:", sorted(core_edges)); sys.exit(1)
      print("OK: from . import utils in __init__.py resolves to app.core.utils")
      PYEOF
    expect_exit: 0

  - id: accepts-first-party-decorator-factory
    description: >
      Reviewer-raised scenario (permanent guard): a first-party decorator FACTORY
      used as @my_tool() (called with parentheses) in a reachable entrypoint → my_tool
      must NOT be flagged dead. A truly-dead sibling def orphan() in the same module
      MUST be flagged. Both halves are asserted so this is a real red-green: a regression
      that removes the decorator-factory call-site edge would break the first assertion;
      removing dead-code detection would break the second.
    cmd: |
      python3 - <<'PYEOF'
      import sys, textwrap
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import evaluate

      tools_code = (
          "def my_tool():\n"
          "    def deco(fn):\n"
          "        return fn\n"
          "    return deco\n\n"
          "def orphan():\n"
          "    return 99\n"
      )
      main_code = (
          "from app.tools import my_tool\n\n"
          "@my_tool()\n"
          "def handler():\n"
          "    return 1\n\n"
          "if __name__ == '__main__':\n"
          "    handler()\n"
      )
      files = {"app/tools.py": tools_code, "app/main.py": main_code}
      lines = tools_code.splitlines()
      added = "\n".join("+" + l for l in lines)
      diff = (
          "diff --git a/app/tools.py b/app/tools.py\n"
          "--- a/app/tools.py\n+++ b/app/tools.py\n"
          f"@@ -0,0 +1,{len(lines)} @@\n" + added + "\n"
      )
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      combined = " ".join(r.hard_failures)
      if "my_tool" in combined:
