  - id: gate-passes-on-own-source
    description: >
      Green: evaluate() on a diff adding dead_code_gate.py's own public functions
      (with its __main__ block and realistic main->evaluate call chain) → PASS.
      After FIX 1 the free <module>->top-level edge is gone; each public function
      must be EXPLICITLY referenced in the call chain. This fixture mirrors the real
      gate: main() calls evaluate(), evaluate() calls build_callgraph / find_entrypoints
      / reachable / extract_changed_public_symbols.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import evaluate

      gate_code = (
          "def extract_changed_public_symbols(diff_text, new_file_reader):\n    return []\n\n"
          "def build_callgraph(source_files, file_reader):\n    return {}\n\n"
          "def find_entrypoints(source_files, file_reader, pyproject_text, allowlist_lines):\n    return set()\n\n"
          "def reachable(graph, roots):\n    return set()\n\n"
          "def evaluate(diff_text, file_reader, pyproject_text, allowlist_lines, source_files=None):\n"
          "    graph = build_callgraph(source_files or [], file_reader)\n"
          "    eps = find_entrypoints(source_files or [], file_reader, pyproject_text, allowlist_lines)\n"
          "    r = reachable(graph, eps)\n"
          "    syms = extract_changed_public_symbols(diff_text, file_reader)\n"
          "    return syms\n\n"
          "def main(argv):\n"
          "    result = evaluate('', lambda p: '', '', [])\n"
          "    return 0\n\n"
          "if __name__ == '__main__':\n    import sys\n    sys.exit(main(sys.argv[1:]))\n"
      )
      files = {"scripts/ci/dead_code_gate.py": gate_code}
      line_count = gate_code.count('\n')
      added = ''.join('+' + l + '\n' for l in gate_code.splitlines())
      diff = (
          "diff --git a/scripts/ci/dead_code_gate.py b/scripts/ci/dead_code_gate.py\n"
          "--- a/scripts/ci/dead_code_gate.py\n"
          "+++ b/scripts/ci/dead_code_gate.py\n"
          f"@@ -0,0 +1,{line_count} @@\n"
          + added
      )
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if not r.ok:
          print("FAIL: gate flagged its own functions as dead:", r.hard_failures); sys.exit(1)
      print("OK: gate passes on its own source")
      PYEOF
    expect_exit: 0

