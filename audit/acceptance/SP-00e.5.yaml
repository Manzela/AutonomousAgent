# Acceptance — SP-00e.5 · dead-code reachability gate (C4)
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# Each assertion is a self-contained red-green that invokes the gate's pure
# functions / evaluate() on inline fixtures via python -c.
# Every assertion FAILS if the gate logic is wrong (real red-green — not "does it exist?").
#
# Source: PRD §6 EPIC 0 SP-00e (C4) — "a symbol with no runtime call site fails
# dead-code-gate; an all-clean PR passes."

task: SP-00e.5
title: "dead-code reachability gate (C4) — block dead symbols; wired-call and wired-value pass"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  - id: detects-dead-symbol
    description: >
      Red: a diff adding public `def orphan()` with no call site → HARD fail naming it.
      If evaluate() returns ok=True the assertion FAILS (wrong logic).
    cmd: |
      python3 - <<'PYEOF'
      import sys, textwrap
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import evaluate

      orphan = "def orphan():\n    return 42\n"
      ep = "if __name__ == '__main__':\n    pass\n"
      files = {"app/orphan_mod.py": orphan, "app/entry.py": ep}
      diff = (
          "diff --git a/app/orphan_mod.py b/app/orphan_mod.py\n"
          "--- a/app/orphan_mod.py\n+++ b/app/orphan_mod.py\n"
          "@@ -0,0 +1,2 @@\n+def orphan():\n+    return 42\n"
      )
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if r.ok:
          print("FAIL: dead orphan() was not caught"); sys.exit(1)
      if not any("orphan" in f for f in r.hard_failures):
          print("FAIL: failure message does not name 'orphan':", r.hard_failures); sys.exit(1)
      print("OK: orphan correctly flagged:", r.hard_failures[0])
      PYEOF
    expect_exit: 0

