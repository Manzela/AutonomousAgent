          sys.exit(1)
      if "orphan" not in combined:
          print("FAIL: orphan() has no call site and MUST be flagged dead:", r.hard_failures)
          sys.exit(1)
      print("OK: my_tool() wired via @my_tool() usage; orphan() correctly flagged")
      PYEOF
    expect_exit: 0

  - id: waiver-ban-survives-multifile-state-leak
    description: >
      BUG 1 FIX (state leak across files): in_triple_string MUST reset at every
      new-file boundary in a multi-file diff. Without the fix, if file A leaves an
      unclosed triple-quote hunk, in_triple_string stays True into file B, causing
      @manual on an added def in file B to be silently skipped (waiver ban bypassed).
      After the fix: state resets at `diff --git ` so file B's @manual IS detected.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import _detect_self_waivers_in_diff

      # File A: adds an unclosed opening triple-quote (no closing """ in the hunk)
      # File B: adds @manual on a public def
      diff = (
          "diff --git a/app/file_a.py b/app/file_a.py\n"
          "--- a/app/file_a.py\n"
          "+++ b/app/file_a.py\n"
          "@@ -0,0 +1,2 @@\n"
          "+def func_a():\n"
          '+    """\n'
          "diff --git a/app/file_b.py b/app/file_b.py\n"
          "--- a/app/file_b.py\n"
          "+++ b/app/file_b.py\n"
          "@@ -0,0 +1,3 @@\n"
          "+@manual\n"
          "+def func_b():\n"
          "+    pass\n"
      )
      found = _detect_self_waivers_in_diff(diff)
      if not found:
          print("FAIL: @manual in file B was NOT detected — state leaked from file A's unclosed triple-quote")
          sys.exit(1)
      if not any("@manual" in s for s in found):
          print("FAIL: found entries do not contain @manual:", found)
          sys.exit(1)
      print("OK: @manual in file B correctly detected despite file A's unclosed triple-quote:", found)
      PYEOF
    expect_exit: 0

  - id: waiver-ban-ignores-removed-line-triplequote
    description: >
      BUG 2 FIX (removed-line state corruption): removed (`-`) lines must NOT affect
      the triple-string toggle. Without the fix, a diff that REMOVES a line with `"""`
      and then ADDS `@manual` on the next line causes the removed `"""` to flip
      in_triple_string, treating the added `@manual` as inside a string (ban bypassed).
      After the fix: `-` lines are skipped for state purposes so the @manual IS detected.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import _detect_self_waivers_in_diff

      # Diff REMOVES a line with """ then ADDS @manual on the next line
      diff = (
          "diff --git a/app/attack_mod.py b/app/attack_mod.py\n"
          "--- a/app/attack_mod.py\n"
          "+++ b/app/attack_mod.py\n"
          "@@ -1,2 +1,3 @@\n"
          '-    """\n'
          "+@manual\n"
          "+def attacked_fn():\n"
          "+    pass\n"
      )
      found = _detect_self_waivers_in_diff(diff)
      if not found:
          print('FAIL: @manual was NOT detected — removed """ line incorrectly flipped triple-string state')
          sys.exit(1)
      if not any("@manual" in s for s in found):
          print("FAIL: found entries do not contain @manual:", found)
          sys.exit(1)
      print("OK: @manual correctly detected despite preceding removed triple-quote line:", found)
      PYEOF
    expect_exit: 0

  - id: self-waiver-scan-is-path-scoped-no-self-trip
    description: >
      REGRESSION (the defect that reverted the first SP-00e.5 merge): the self-waiver
      scan MUST SKIP added lines belonging to this gate's own source, its test fixtures
      (tests/**), and its acceptance spec (audit/acceptance/**) — those carry the marker
      as data/docs by construction. It MUST still flag the marker in genuine runtime code
      (app/**) and in header-less raw fragments. This is what lets the gate pass on its
      OWN full PR diff instead of self-tripping on its fixtures + docstring.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import _detect_self_waivers_in_diff as scan

      MK = "@" + "manual"  # build dynamically so this spec's own *.py-free text is moot
      def hdr(p): return f"diff --git a/{p} b/{p}\n--- a/{p}\n+++ b/{p}\n@@ -0,0 +1,3 @@\n"
      excluded = {
          "tests/ci/test_x.py": hdr("tests/ci/test_x.py") + f"+{MK}\n+def f():\n+    pass\n",
          "audit/acceptance/SP-00e.5.yaml": hdr("audit/acceptance/SP-00e.5.yaml") + f"+{MK}\n",
          "scripts/ci/dead_code_gate.py": hdr("scripts/ci/dead_code_gate.py") + f"+{MK}\n",
      }
      for path, diff in excluded.items():
          if scan(diff):
              print(f"FAIL: self-waiver scan must SKIP excluded path {path}:", scan(diff)); sys.exit(1)
      app_diff = hdr("app/real_mod.py") + f"+{MK}\n+def waived():\n+    pass\n"
      if not scan(app_diff):
          print("FAIL: marker in app/ runtime code must be flagged"); sys.exit(1)
      if not scan(f"+{MK}\n+def fn():\n+    pass\n"):
          print("FAIL: marker in header-less fragment must be flagged"); sys.exit(1)
      print("OK: self-waiver scan is path-scoped (excluded paths skipped; app/ + raw flagged)")
      PYEOF
    expect_exit: 0

  - id: self-waiver-scan-rejects-plusplus-header-evasion
    description: >
      C9 BLOCKER regression: an added CONTENT line starting with '++' yields a diff line
      starting with '+++'. It must NOT be parsed as a '+++ b/<path>' file header mid-hunk
      (which would flip the path-exclusion and skip a real waiver). The marker that follows
      in app/ runtime code MUST still be flagged. Covers no-space and space content forms.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import _detect_self_waivers_in_diff as scan
      MK = "@" + "manual"
      for evil in ("+++evil", "+++ evil"):
          diff = (
              "diff --git a/app/evil.py b/app/evil.py\n"
              "--- a/app/evil.py\n+++ b/app/evil.py\n"
              "@@ -0,0 +1,4 @@\n"
              f"{evil}\n"
              f"+{MK}\n+def waived():\n+    return 1\n"
          )
          if not scan(diff):
              print(f"FAIL: in-hunk '+++' content {evil!r} evaded the self-waiver scan"); sys.exit(1)
      print("OK: in-hunk '+++' content cannot evade the self-waiver scan")
      PYEOF
    expect_exit: 0

