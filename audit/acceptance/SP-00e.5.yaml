      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if r.ok:
          print("FAIL: @manual on bare top-level def must be a HARD fail"); sys.exit(1)
      combined = " ".join(r.hard_failures).lower()
      if "manual" not in combined and "waiver" not in combined:
          print("FAIL: failure must mention @manual/waiver:", r.hard_failures); sys.exit(1)
      print("OK: bare @manual correctly caught:", r.hard_failures[0])
      PYEOF
    expect_exit: 0

