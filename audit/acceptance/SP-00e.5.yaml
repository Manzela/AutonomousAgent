  - id: rejects-passive-decorator-only-dead-symbol
    description: >
      FIX B (passive decorator denylist): @functools.cache (passive) on an orphan fn
      in an imported module → HARD fail. Before FIX B, ANY decorator wired the symbol;
      an agent could slap @cache on dead code to get a free pass. Passive decorators
      (cache, lru_cache, property, staticmethod, etc.) do NOT constitute call sites.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.dead_code_gate import evaluate

      orphan = "import functools\n\n@functools.cache\ndef orphan():\n    return 42\n"
      ep = "import app.orphan_passive\nif __name__ == '__main__':\n    pass\n"
      files = {"app/orphan_passive.py": orphan, "app/entry.py": ep}
      lines = orphan.splitlines()
      added = "\n".join("+" + l for l in lines)
      diff = (
          "diff --git a/app/orphan_passive.py b/app/orphan_passive.py\n"
          "--- a/app/orphan_passive.py\n+++ b/app/orphan_passive.py\n"
          f"@@ -0,0 +1,{len(lines)} @@\n" + added + "\n"
      )
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if r.ok:
          print("FAIL: @functools.cache (passive) must NOT wire the symbol"); sys.exit(1)
      if not any("orphan" in f for f in r.hard_failures):
          print("FAIL: failure must name orphan:", r.hard_failures); sys.exit(1)
      print("OK: passive decorator correctly rejected:", r.hard_failures[0])
      PYEOF
    expect_exit: 0

