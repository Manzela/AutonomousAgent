          "+++ b/scripts/ci/entry_with_orphan.py\n"
          f"@@ -0,0 +1,{len(lines)} @@\n"
          + added + "\n"
      )
      r = evaluate(diff, lambda p: files[p], "", [], list(files.keys()))
      if r.ok:
          print("FAIL: orphan() in entrypoint module must still fail"); sys.exit(1)
      if not any("orphan" in f for f in r.hard_failures):
          print("FAIL: failure must name orphan:", r.hard_failures); sys.exit(1)
      if any("main" in f for f in r.hard_failures):
          print("FAIL: main() referenced in __main__ block must not be flagged:", r.hard_failures); sys.exit(1)
      print("OK: orphan() still fails; main() passes")
