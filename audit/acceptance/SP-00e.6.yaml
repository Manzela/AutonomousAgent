  - id: exit-code-always-zero
    description: >
      Advisory contract: main() with a smelly test file still exits 0.
      If exit code is non-zero, assertion FAILS (gate is blocking, not advisory).
    cmd: |
      python3 - <<'PYEOF'
      import sys, subprocess, tempfile, os
      sys.path.insert(0, '.')

      needle = "re" + "fuse"
      with tempfile.TemporaryDirectory() as tmp:
          path = os.path.join(tmp, "test_smelly.py")
          with open(path, "w") as f:
              f.write(f'def test_bad():\n    output = run()\n    assert "{needle}" in output\n')
          result = subprocess.run(
              [sys.executable, "scripts/ci/substring_assert_lint.py", "--root", tmp],
              capture_output=True, text=True
          )
      if result.returncode != 0:
          print(f"FAIL: exit code was {result.returncode} (must be 0 for advisory)"); sys.exit(1)
      if "::warning::" not in result.stdout:
          print("FAIL: no ::warning:: annotation emitted:", result.stdout); sys.exit(1)
      print("OK: advisory gate exits 0 with ::warning:: annotation:", result.stdout.strip())
      PYEOF
    expect_exit: 0

