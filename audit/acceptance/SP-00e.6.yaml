# Acceptance — SP-00e.6 · provenance-check (C11) + no-sentinel-termination (anti-drift) + substring-lint (C3)
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# Each assertion is a self-contained red-green that invokes the gate's pure functions
# on inline fixtures via a python3 heredoc (sys.path.insert(0,'.') + import). Every
# assertion FAILS if the gate logic is wrong (real red-green — not "does it exist?").
# Trigger-literals (sentinels, add-cues) are built by concatenation inside the heredocs
# so the C6 no-skip/test-integrity grep over added .py lines does not self-trip.
#
# Source: PRD §4 C11 (L113 provenance honesty) + anti-drift loop control clause (e)
#   (L122-128 no-sentinel-termination) + C3 (L105 lint-no-substring-asserts, advisory) +
#   §6 EPIC 0 SP-00e row (L229).

task: SP-00e.6
title: "provenance-check (C11) + no-sentinel-termination (anti-drift) + substring-lint (C3 advisory)"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  # --- provenance ---
  - id: c11-pass-genuine-add
    description: >
      Green: Evidence says "created scripts/ci/new_gate.py" and it IS in added_set
      -> evaluate().ok is True with no failures.
    cmd: |
      python3 - <<'PYEOF'
      import sys
      sys.path.insert(0, '.')
      from scripts.ci.provenance_check import evaluate

      CREATE_CUE = "creat" + "ed"
      evidence = f"{CREATE_CUE} scripts/ci/new_gate.py for provenance enforcement"
      added_set = {"scripts/ci/new_gate.py"}
      def ancestry_of(path): return False
      r = evaluate(evidence, added_set, ancestry_of)
      if not r.ok:
          print("FAIL: genuine add incorrectly flagged:", r.failures); sys.exit(1)
      if r.failures:
          print("FAIL: unexpected failures:", r.failures); sys.exit(1)
      print("OK: genuine add passes cleanly")
      PYEOF
    expect_exit: 0

