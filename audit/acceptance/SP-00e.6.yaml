  - id: f-no-sentinel-ignore-escape
    description: >
      Green: violation line carrying "no-sentinel: ignore" -> skipped.
      Also: escape on line above skips. Escape 2 lines above does NOT suppress.
    cmd: |
      python3 - <<'PYEOF'
      import sys, textwrap
      sys.path.insert(0, '.')
      from scripts.ci.no_sentinel_termination import find_sentinel_violations
      sentinel = "GOAL" + "_COMPLETE"
      escape = "no-sentinel" + ": ignore"
      # Inline escape
      src_inline = textwrap.dedent(f"""
      def check(text):
          if {sentinel!r} in text:  # {escape}
              break
      """)
      v = find_sentinel_violations(src_inline, "app/x.py")
      if v:
          print(f"FAIL: inline escape not honored: {v}"); sys.exit(1)
      # Preceding line escape
      src_above = textwrap.dedent(f"""
      def check(text):
          # {escape}
          if {sentinel!r} in text:
              break
      """)
      v2 = find_sentinel_violations(src_above, "app/x.py")
      if v2:
          print(f"FAIL: preceding-line escape not honored: {v2}"); sys.exit(1)
      # Escape 2 lines above must NOT suppress
      src_far = textwrap.dedent(f"""
      def check(text):
          # {escape}
          x = 1
          if {sentinel!r} in text:
              break
      """)
      v3 = find_sentinel_violations(src_far, "app/x.py")
      if not v3:
          print("FAIL: escape 2 lines above should NOT suppress violation"); sys.exit(1)
      print("OK: inline and preceding-line escape honored; 2-lines-above does not suppress")
      PYEOF
    expect_exit: 0

  - id: g-gate-green-on-durability-resume-mirror
    description: >
      Green: fixtures mirroring lib/durability/resume.py .done usage -> no violations.
    cmd: |
      python3 - <<'PYEOF'
      import sys, textwrap
      sys.path.insert(0, '.')
      from scripts.ci.no_sentinel_termination import find_sentinel_violations
      src = textwrap.dedent("""
      import os
      from pathlib import Path

      DONE_SENTINEL = ".done"

      def _is_done(session_dir):
          \"\"\"Check if session is marked DONE via .done sentinel file.\"\"\"
          return (session_dir / DONE_SENTINEL).exists()

      def rehydrate_for_session(session_id, root_dir=None):
          \"\"\"Returns None if session is marked DONE.\"\"\"
          session_dir = Path(root_dir or "/data") / session_id
          if not session_dir.exists() or _is_done(session_dir):
              return None
          return {}

      def _most_recent_incomplete_session(root):
          \"\"\"Return session_id of most recent non-DONE session.\"\"\"
          best = None
          for session_dir in root.iterdir():
              if _is_done(session_dir):
                  continue
              best = session_dir.name
          return best
      """)
      v = find_sentinel_violations(src, "lib/durability/resume.py")
      if v:
          print(f"FAIL: resume.py mirror has violations: {v}"); sys.exit(1)
      print("OK: resume.py mirror is clean")
      PYEOF
    expect_exit: 0

  - id: h-scan-tree-path-scoping
    description: >
