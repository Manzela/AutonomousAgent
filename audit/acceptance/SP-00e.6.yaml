        - test_*.py violation is excluded
    cmd: |
      python3 - <<'PYEOF'
      import sys, textwrap
      sys.path.insert(0, '.')
      from scripts.ci.no_sentinel_termination import scan_tree
      sentinel = "GOAL" + "_COMPLETE"
      src_bad = textwrap.dedent(f"""
      def run(text):
          if {sentinel!r} in text:
              break
      """)
      # app/ -> flagged
      files_app = {"app/agent.py": src_bad}
      v = scan_tree(["app"], lambda p: files_app[p], lambda r: [k for k in files_app if k.startswith(r)])
      if not v:
          print("FAIL: app/ violation not flagged"); sys.exit(1)
      # scripts/ -> excluded
      files_scripts = {"scripts/ci/some_gate.py": src_bad}
      v2 = scan_tree(["scripts"], lambda p: files_scripts[p], lambda r: [k for k in files_scripts if k.startswith(r)])
      if v2:
          print(f"FAIL: scripts/ should be excluded: {v2}"); sys.exit(1)
      # test_*.py -> excluded
      files_test = {"app/test_agent.py": src_bad}
      v3 = scan_tree(["app"], lambda p: files_test[p], lambda r: [k for k in files_test if k.startswith(r)])
      if v3:
          print(f"FAIL: test_*.py should be excluded: {v3}"); sys.exit(1)
      print("OK: path scoping correct")
      PYEOF
    expect_exit: 0
