    (c) blocked-egress→PR-comment emitter (SP-00g C16 surface requirement).
        Blocked on: SP-05 as the event source.

    (d) Production HTTP_PROXY wiring into deploy/docker-compose.yml (8 egress services).
        Gated: needs staging validation; LiteLLM→Vertex gRPC ignores HTTP_PROXY.

  status: PARTIAL/OPEN per C8
