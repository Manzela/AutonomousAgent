# Acceptance — SP-00h · license + new-dep allowlist gate (blocking)
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# Assertions are stdlib + the gate script only (run_acceptance.py re-runs them, C1).
# Each "detects-*" assertion is a self-contained red-green: it creates a deliberately-
# broken temp input, runs the gate, and exits 0 ONLY IF the gate returned non-zero (C2/C12).
#
# Scope (honest):
#   - Covers: unpinned added deps, typosquat detection, disallowed-license headers in
#     added source files.
#   - NOT in scope here: vuln/CVE scanning (OSV-Scanner + Dependabot already cover this).
#   - Advisory: resolved-env pip-licenses scan (full blocking tracked under SP-G1).
#
# Operator-gated (documented, not faked):
#   Adding "license-dep-gate / license-dep-gate" to required_status_checks via
#   `gh api repos/Manzela/AutonomousAgent/branches/main/protection` requires admin
#   scope and must be executed manually after the first successful CI run.
#
# Source: PRD §6 EPIC 0 SP-00h.

task: SP-00h
title: "license + new-dep allowlist gate (blocking) — GPL/AGPL/unpinned/typosquat blocked in PR diff"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  - id: detects-unpinned-added-dep
    description: >
      Self-contained red-green (C2/C12): a diff that ADDS a bare (unpinned) dep using
      the REAL PEP-621 pyproject.toml structure (`dependencies = [` under `[project]`,
      NOT the legacy `[project.dependencies]` section header) must make the gate FAIL
      (exit non-zero). This exercises the PEP-621 parse path (Fix 2). Exits 0 only if
      the gate correctly returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/bad_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       name = "myapp"
       dependencies = [
      +  "bare-unpinned-dep",
       ]
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/bad_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: unpinned dep not caught by gate (PEP-621 parse path)"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected unpinned added dep (PEP-621 structure)"
    expect_exit: 0

  - id: detects-gpl-license-in-added-source
    description: >
      Self-contained red-green (C2/C12): an added Python source file carrying a
      GPL SPDX-License-Identifier header must make the gate FAIL. Exits 0 only if
      the gate correctly returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      # Empty pyproject diff (no dep changes)
      printf '' > "$tmp/empty_diff.txt"
      # Added source file with disallowed GPL header
      printf '# SPDX-License-Identifier: GPL-3.0-only\nimport os\n' \
        > "$tmp/gpl_file.py"
      printf '%s\n' "$tmp/gpl_file.py" > "$tmp/added_files.txt"
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/empty_diff.txt" \
           --added-files "$tmp/added_files.txt" >/dev/null 2>&1; then
        echo "FAIL: GPL header not caught by gate"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected GPL-licensed added source file"
    expect_exit: 0

  - id: detects-agpl-license-in-added-source
    description: >
      Self-contained red-green (C2/C12): an added source file with AGPL SPDX header
      must be rejected. Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      printf '' > "$tmp/empty_diff.txt"
      printf '# SPDX-License-Identifier: AGPL-3.0-or-later\nimport sys\n' \
        > "$tmp/agpl_file.py"
      printf '%s\n' "$tmp/agpl_file.py" > "$tmp/added_files.txt"
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/empty_diff.txt" \
           --added-files "$tmp/added_files.txt" >/dev/null 2>&1; then
        echo "FAIL: AGPL header not caught by gate"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected AGPL-licensed added source file"
    expect_exit: 0

  - id: detects-all-rights-reserved-prose
    description: >
      Self-contained red-green (C2/C12): a file with an 'All Rights Reserved'
      prose copyright notice (no SPDX header) must be rejected. Exits 0 only
      if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      printf '' > "$tmp/empty_diff.txt"
      printf '# Copyright 2025 Evil Corp. All Rights Reserved.\nimport os\n' \
        > "$tmp/rights_file.py"
      printf '%s\n' "$tmp/rights_file.py" > "$tmp/added_files.txt"
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/empty_diff.txt" \
           --added-files "$tmp/added_files.txt" >/dev/null 2>&1; then
        echo "FAIL: 'All Rights Reserved' not caught by gate"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected 'All Rights Reserved' file"
    expect_exit: 0

  - id: detects-typosquat-added-dep
    description: >
      Self-contained red-green (C2/C12): a dep named 'requuests' (1-edit from
      'requests', not in allowlist) added to pyproject.toml must cause the gate to
      FAIL. Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/typosquat_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project.dependencies]
      +  "requuests>=2.28",
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/typosquat_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: typosquat dep not caught by gate"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected typosquat dep 'requuests'"
    expect_exit: 0

  - id: accepts-clean-pinned-dep-and-mit-source
    description: >
      Green control: a diff adding a pinned dep from the allowlist using the real
      PEP-621 structure (`dependencies = [` under `[project]`) plus a source file with
      an MIT SPDX header passes the gate (exit 0). Proves the gate is not trivially
      always-fail and that PEP-621 parse path accepts legitimate additions.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/clean_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       name = "myapp"
       dependencies = [
      +  "pyyaml>=6.0",
       ]
      DIFF
      printf '# SPDX-License-Identifier: MIT\nimport os\n' > "$tmp/clean_file.py"
      printf '%s\n' "$tmp/clean_file.py" > "$tmp/added_files.txt"
      python3 scripts/ci/license_dep_gate.py \
        --pyproject-diff "$tmp/clean_diff.txt" \
        --added-files "$tmp/added_files.txt"
      rc=$?; rm -rf "$tmp"; exit $rc
    expect_exit: 0

  - id: accepts-empty-diff-no-added-files
    description: >
      Green control: a PR that touches no pyproject.toml and no source files passes
      trivially (exit 0).
    cmd: |
      tmp="$(mktemp -d)"
      printf '' > "$tmp/empty_diff.txt"
      python3 scripts/ci/license_dep_gate.py \
        --pyproject-diff "$tmp/empty_diff.txt" \
        --added-files /dev/null
      rc=$?; rm -rf "$tmp"; exit $rc
    expect_exit: 0

  - id: gate-passes-on-own-source
    description: >
      Regression guard (Fix 1): the gate must NOT flag its own source file
      scripts/ci/license_dep_gate.py. The script defines GPL/AGPL/LGPL as string
      constants — bare keyword scanning would false-positive here, which was the root
      cause of the CI red. Exits 0 only if the gate exits 0 when scanning its own file.
    cmd: |
      tmp="$(mktemp -d)"
      # Empty pyproject diff (no dep changes in the gate's own PR)
      printf '' > "$tmp/empty_diff.txt"
      # List the gate's own source as an "added" file
      printf 'scripts/ci/license_dep_gate.py\n' > "$tmp/added_files.txt"
      python3 scripts/ci/license_dep_gate.py \
        --pyproject-diff "$tmp/empty_diff.txt" \
        --added-files "$tmp/added_files.txt"
      rc=$?
      rm -rf "$tmp"
      if [ "$rc" -ne 0 ]; then
        echo "FAIL: gate falsely flagged its own source file (Fix 1 regression)"; exit 1
      fi
      echo "OK: gate passes on its own source (disallowed_license_in returns None)"
    expect_exit: 0

  - id: pinned-dep-gt-lt-operators
    description: >
      Regression guard (Fix 3): a dep specifier using PEP-440 `>` or `<` operators
      (`pkg > 1.0`, `pkg < 2.0`) must be treated as PINNED and must NOT trigger the
      unpinned-dep hard failure. Uses an allowlisted dep (pyyaml) with gt/lt pins.
      Exits 0 only if the gate exits 0 (no hard failure) for both operators.
    cmd: |
      tmp="$(mktemp -d)"
      # pyyaml with a > lower bound — must be treated as pinned
      cat > "$tmp/gt_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       dependencies = [
      +  "pyyaml > 5.0",
       ]
      DIFF
      python3 scripts/ci/license_dep_gate.py \
        --pyproject-diff "$tmp/gt_diff.txt" \
        --added-files /dev/null
      rc_gt=$?
      cat > "$tmp/lt_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       dependencies = [
      +  "pyyaml < 7.0",
       ]
      DIFF
      python3 scripts/ci/license_dep_gate.py \
        --pyproject-diff "$tmp/lt_diff.txt" \
        --added-files /dev/null
      rc_lt=$?
      rm -rf "$tmp"
      if [ "$rc_gt" -ne 0 ] || [ "$rc_lt" -ne 0 ]; then
        echo "FAIL: gate rejected pyyaml with > or < operator (Fix 3 regression)"; exit 1
      fi
      echo "OK: gate correctly accepts > and < version operators as pinned"
    expect_exit: 0

  - id: detects-unknown-not-allowlisted-dep
    description: >
      Red-green (Fix 4): a dep that is NOT in the allowlist and NOT a typosquat must
      cause a HARD failure (exit non-zero). Adding a dep to the allowlist is a reviewed
      act — the gate enforces this by blocking merges for any unreviewed addition.
      Exits 0 only if the gate correctly returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      # 'totally-new-library' is not a typosquat of any popular package and is not
      # in the built-in allowlist — must be a hard failure.
      cat > "$tmp/unknown_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       dependencies = [
      +  "totally-new-library>=1.0",
       ]
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/unknown_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: unknown non-allowlisted dep was not rejected (Fix 4 regression)"
        rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly hard-failed on unknown not-allowlisted dep"
    expect_exit: 0

  - id: detects-inline-single-line-array-bare-dep
    description: >
      FINDING 1 (CRITICAL bypass): a dep added in a fully-inline single-line PEP-621
      array (`+dependencies = ["bare-dep"]`) must NOT bypass the gate.  The opener-line
      `continue` previously swallowed the inline content; this assertion is the hard
      red-green that proves the fix holds.  Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/inline_array_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       name = "myapp"
      +dependencies = ["bare-dep"]
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/inline_array_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: inline single-line array bypass NOT caught (Finding 1 critical)"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate caught bare dep in inline single-line PEP-621 array"
    expect_exit: 0

  - id: detects-two-deps-on-one-added-line
    description: >
      FINDING 1 (CRITICAL bypass): when two deps appear on one added diff line
      (`"pkg1==1.0", "pkg2"`) the gate must extract BOTH as separate specifiers
      and flag the unpinned/unknown one (pkg2).  Previously the whole line was
      treated as one garbled specifier.  Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/two_deps_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       dependencies = [
      +  "pyyaml==6.0", "bare-dep",
       ]
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/two_deps_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: two-deps-on-one-line bypass NOT caught (Finding 1 critical)"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate caught the unpinned dep from a two-deps-on-one-line added diff line"
    expect_exit: 0

  - id: detects-proprietary-confidential-prose
    description: >
      FINDING 2 (prose regression): a source file with a comment line carrying
      both 'Proprietary' and 'Confidential' (the canonical dual-keyword notice,
      no SPDX header) must be rejected.  The pattern requires BOTH words on the
      same '#'-comment line to avoid false-positives on explanatory comments.
      Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      printf '' > "$tmp/empty_diff.txt"
      printf '# Proprietary and Confidential\nimport os\n' > "$tmp/prop_conf.py"
      printf '%s\n' "$tmp/prop_conf.py" > "$tmp/added_files.txt"
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/empty_diff.txt" \
           --added-files "$tmp/added_files.txt" >/dev/null 2>&1; then
        echo "FAIL: Proprietary+Confidential prose not caught (Finding 2 regression)"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly rejected Proprietary+Confidential prose notice"
    expect_exit: 0

  - id: not-equal-only-spec-is-unpinned
    description: >
      NIT: a dep specifier with only '!=' (e.g. 'pyyaml!=6.0') is an exclusion,
      not a pin — it still allows any other version.  The gate must treat it as
      unpinned and produce a hard failure.  Exits 0 only if the gate returned non-zero.
    cmd: |
      tmp="$(mktemp -d)"
      cat > "$tmp/ne_only_diff.txt" << 'DIFF'
      --- a/pyproject.toml
      +++ b/pyproject.toml
       [project]
       dependencies = [
      +  "pyyaml!=6.0",
       ]
      DIFF
      if python3 scripts/ci/license_dep_gate.py \
           --pyproject-diff "$tmp/ne_only_diff.txt" \
           --added-files /dev/null >/dev/null 2>&1; then
        echo "FAIL: !=only spec was not flagged as unpinned (NIT regression)"; rm -rf "$tmp"; exit 1
      fi
      rm -rf "$tmp"
      echo "OK: gate correctly treats !=only spec as unpinned"
    expect_exit: 0

proof:
  ci_workflow: .github/workflows/license-dep-gate.yml
  artifact: license-dep-gate (unit tests + acceptance re-run + advisory pip-licenses scan)

