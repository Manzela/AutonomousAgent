# PRD §5 SP-05 — production sandbox tier: Cloud Run Jobs (gVisor/runsc isolation).
# app/adapters/gcp/cloud_run_sandbox.py implements CloudRunJobSandbox(AbstractSandbox)
# with lazy google.cloud.run_v2 imports so CI runs without the gcp extra installed.
# Hard refusal: network_allowed=True raises PermissionError (Cloud Run Jobs are not
# network-isolated; accepting the flag would silently mislead callers).
# is_production_grade=True (marks this class as the intended production sandbox tier).
#
# ORACLE MAP (18 hermetic tests — no GCP credentials / no real Cloud Run Jobs):
#
#   Base oracles:
#   ①  network_allowed=True raises PermissionError (hard refusal).
#   ②  CloudRunJobSandbox is an AbstractSandbox subclass (class hierarchy).
#   ③  is_production_grade class attribute is True.
#   ④  empty project_id raises ValueError at construction.
#   ⑤  empty region raises ValueError at construction.
#   ⑥  empty job_name raises ValueError at construction.
#   ⑦  _build_run_job_request sets args=cmd on the container override.
#   ⑧  _build_run_job_request forwards env vars as EnvVar objects.
#   ⑨  _build_run_job_request: None env → empty env list (no EnvVar objects).
#
#   _execution_succeeded helper:
#   ⑩  CONDITION_SUCCEEDED + state=1 → True.
#   ⑪  CONDITION_FAILED + state=1 → False.
#   ⑫  Fallback: completion_time set + failed_count=0 → True.
#   ⑬  Fallback: completion_time None → False.
#
#   Integration path:
#   ⑭  Successful execution (fake LRO) → returncode=0, killed=False.
#   ⑮  Execution exceeding timeout_s → killed=True, returncode=1.
#   ⑯  ImportError from lazy _lazy_run_v2() propagates with install hint.
#   ⑰  job FQN constructed as projects/{p}/locations/{r}/jobs/{j}.
#   ⑱  _collect_execution_logs deferred stub returns ("", "").
#
# C9 SECURITY REVIEW (adversarial, different model class):
#   Reviewer model: claude-opus-4-7
#   Review verdict: APPROVED — no security findings.
#   Review notes:
#     - network_allowed hard refusal correctly placed before any I/O (cannot bypass).
#     - Lazy import pattern safe: ImportError propagates loudly with actionable hint.
#     - No shell interpolation in cmd/env forwarding (passed as list/struct, not shell).
#     - _build_run_job_request is a pure function; no mutable global state.
#     - LRO cancel is best-effort fail-open (logged + continues) — correct for panic paths.
#     - SP-05c-INT-1 log collection deferred: stub returns empty strings, no data leak.
#
# DEFERRED (tagged SP-05c-INT):
