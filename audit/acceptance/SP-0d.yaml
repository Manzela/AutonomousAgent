# Acceptance — SP-0d · close meta-audit P0-4 (false positive) + record the real gap
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# PRD §6 SP-0d acceptance: "git log --all -- lib/observability/ledger.py empty; a GitHub
# issue exists." The git-log-empty proof is machine-checked here; the closeout doc carries
# the ready-to-file issue text (gh issue create is classifier-blocked in autonomous sessions,
# so the "issue exists" criterion is operator-gated — tracked in the doc, not dropped).

task: SP-0d
title: "P0-4 false-positive closeout + TamperEvidentLedger/FailureDetectors gap recorded"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  - id: p0-4-ledger-never-existed
    description: >
      P0-4 FP — lib/observability/ledger.py has NO introducing history on any ref
      (the audit-plan fabricated the file). Empty `git log --all` output == false positive.
    cmd: |
      out="$(git log --all --oneline -- lib/observability/ledger.py)"
      if [ -n "$out" ]; then
        echo "FAIL: lib/observability/ledger.py HAS history (not a false positive): $out"; exit 1
      fi
      echo "OK: lib/observability/ledger.py never existed — P0-4 confirmed false positive"
    expect_exit: 0

  - id: p0-4-failure-detectors-never-existed
    description: >
      P0-4 FP — lib/observability/failure_detectors.py has NO introducing history on any ref.
    cmd: |
      out="$(git log --all --oneline -- lib/observability/failure_detectors.py)"
      if [ -n "$out" ]; then
        echo "FAIL: lib/observability/failure_detectors.py HAS history: $out"; exit 1
      fi
      echo "OK: lib/observability/failure_detectors.py never existed — P0-4 confirmed false positive"
    expect_exit: 0

  - id: p0-4-no-phantom-impl-present
    description: >
      The phantom symbols have no real implementation anywhere in runtime code — confirms
      the gap is genuine (recorded as a tracked issue), not silently satisfied by some stub.
    cmd: |
      hits="$(grep -rnE 'class (TamperEvidentLedger|FailureDetectors)\b' lib/ app/ --include='*.py' 2>/dev/null || true)"
      if [ -n "$hits" ]; then
        echo "FAIL: a TamperEvidentLedger/FailureDetectors class exists — update the closeout: $hits"; exit 1
      fi
      echo "OK: no TamperEvidentLedger/FailureDetectors implementation — gap is real and recorded"
    expect_exit: 0

  - id: p0-4-closeout-records-fp-and-real-gap
    description: >
      The closeout doc exists, records the FALSE POSITIVE determination, and carries the
      ready-to-file real-gap issue (names TamperEvidentLedger) so the gap is not dropped.
    cmd: |
      doc="audit/2026-05-28-meta-audit/P0-4-closeout.md"
      test -f "$doc" || { echo "FAIL: closeout doc missing: $doc"; exit 1; }
      grep -q "FALSE POSITIVE" "$doc" || { echo "FAIL: doc must record the FALSE POSITIVE determination"; exit 1; }
      grep -q "TamperEvidentLedger" "$doc" || { echo "FAIL: doc must name the real TamperEvidentLedger gap"; exit 1; }
      grep -q "FailureDetectors" "$doc" || { echo "FAIL: doc must name the FailureDetectors gap"; exit 1; }
      echo "OK: closeout doc records the FP and the ready-to-file real gap"
    expect_exit: 0

proof:
  ci_workflow: .github/workflows/sp-0d-closeout.yml
  artifact: P0-4 false-positive git-log proof + closeout doc with the ready-to-file gap issue
