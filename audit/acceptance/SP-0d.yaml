# Acceptance — SP-0d · TamperEvidentLedger/FailureDetectors implemented
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
# PRD §6 SP-0d acceptance: "TamperEvidentLedger/FailureDetectors implemented and fully tested."

task: SP-0d
title: "TamperEvidentLedger/FailureDetectors implemented + verified"
driver: V
phase: gate-0
run_from: repo_root

assertions:
  - id: p0-4-ledger-implemented
    description: >
      lib/observability/ledger.py exists and contains the TamperEvidentLedger class.
    cmd: |
      if [ ! -f "lib/observability/ledger.py" ]; then
        echo "FAIL: lib/observability/ledger.py does not exist"; exit 1
      fi
      grep -q "class TamperEvidentLedger" lib/observability/ledger.py || {
        echo "FAIL: TamperEvidentLedger class not found"
        exit 1
      }
      echo "OK: lib/observability/ledger.py exists and is implemented"
    expect_exit: 0

  - id: p0-4-failure-detectors-implemented
    description: >
      lib/observability/failure_detectors.py exists and contains the FailureDetectors class.
    cmd: |
      if [ ! -f "lib/observability/failure_detectors.py" ]; then
        echo "FAIL: lib/observability/failure_detectors.py does not exist"; exit 1
      fi
      grep -q "class FailureDetectors" lib/observability/failure_detectors.py || {
        echo "FAIL: FailureDetectors class not found"
        exit 1
      }
      echo "OK: lib/observability/failure_detectors.py exists and is implemented"
    expect_exit: 0

  - id: p0-4-unit-tests-present
    description: >
      Unit tests exist for both TamperEvidentLedger and FailureDetectors.
    cmd: |
      test -f "tests/unit/test_ledger.py" || {
        echo "FAIL: tests/unit/test_ledger.py missing"
        exit 1
      }
      test -f "tests/unit/test_failure_detectors.py" || {
        echo "FAIL: tests/unit/test_failure_detectors.py missing"
        exit 1
      }
      echo "OK: unit tests exist for ledger and failure detectors"
    expect_exit: 0

  - id: p0-4-closeout-records-gap-resolution
    description: >
      The closeout doc exists and names the TamperEvidentLedger and FailureDetectors components.
    cmd: |
      doc="audit/2026-05-28-meta-audit/P0-4-closeout.md"
      test -f "$doc" || { echo "FAIL: closeout doc missing: $doc"; exit 1; }
      grep -q "TamperEvidentLedger" "$doc" || {
        echo "FAIL: doc must name TamperEvidentLedger"
        exit 1
      }
      grep -q "FailureDetectors" "$doc" || {
        echo "FAIL: doc must name FailureDetectors"
        exit 1
      }
      echo "OK: closeout doc exists and contains required records"
    expect_exit: 0

proof:
  ci_workflow: .github/workflows/sp-0d-closeout.yml
  artifact: TamperEvidentLedger + FailureDetectors implementation and verified unit tests
