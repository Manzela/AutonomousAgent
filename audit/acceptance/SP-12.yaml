    OTEL_TRACES_EXPORTER=none OTEL_METRICS_EXPORTER=none uv run --extra dev python -m pytest \
      tests/unit/test_sp12_ci_self_heal.py \
      -v -q
  expect_exit: 0

proof:
  ci_workflow: .github/workflows/ci.yml
  artifact: >
    16 hermetic oracles in tests/unit/test_sp12_ci_self_heal.py.
    app/core/ci_self_heal.py: AutoMergePolicy (eval-gated merge decision),
    CheckResult, AutoMergeDecision, SelfHealEvent (repository_dispatch payload
    parser). AutoMergePolicy.evaluate() blocks merge when SP-06 eval gate is
    absent or failing, even if lint+unit are GREEN (PRD negative path oracle ⑤).
    Eval gate identified by name fragments: "eval-gate", "sp-06", "conformance",
