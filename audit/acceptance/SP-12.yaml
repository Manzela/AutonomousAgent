    check results via gh API and applies AutoMergePolicy.
    .github/workflows/sp12-ci-self-heal.yml: dispatches repository_dispatch
    ci-failure on CI workflow_run failure using SP-00f GitHub App token.
    .github/workflows/sp12-auto-merge.yml: squash-merges PR only when all
    required checks pass AND eval gate passes; uses SP-00f App token.
    C9 review: claude-opus-4-7 (different model class) — APPROVED.
    DEFERRED: reusable workflow refactor (SP-12-INT-1), Deployment Environment
