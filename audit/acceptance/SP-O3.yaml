# Acceptance — SP-O3 · Production trace → eval regression pipeline (Langfuse integration)
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
#
# PRD §6 SP-O3: Connect to Langfuse, identify failed/low-score spans, extract their
# inputs into a regression test suite (YAML format consumable by Promptfoo / DeepEval).
# When Langfuse is unreachable or credentials are missing, the pipeline is fail-open:
# logs a warning and returns an empty result — it never crashes the caller.
#
# Prior state: evals/trace_to_eval_pipeline.py existed as THEATRE (hardcoded literal stub
# returning a static YAML). This slice replaces it with a real Langfuse SDK integration.
#
# Scope:
#   * LangfuseTraceClient — lazily initialises the SDK, gracefully handles ImportError
#     and missing credentials; fetches traces tagged "error"/"failure"
#   * traces_to_eval_cases — converts trace dicts to Promptfoo-compatible eval cases
#   * write_regression_yaml — writes YAML consumable by Promptfoo / DeepEval
#   * generate_regression_evals_from_traces — public entrypoint, orchestrates the pipeline
#   * All SDK interactions are hermetically mocked (no real Langfuse / network calls)
#
# ORACLE MAP (8 hermetic tests — no real Langfuse / network):
#   ① test_traces_to_eval_cases_converts     — mock traces → eval cases with correct structure
#   ② test_traces_to_eval_cases_skips_empty_input — empty input → skipped, not converted
#   ③ test_write_regression_yaml             — cases → valid YAML with correct description key
#   ④ test_generate_pipeline_with_mock       — full pipeline with mock Langfuse client → 2 cases
#   ⑤ test_graceful_no_credentials           — missing creds → empty list, no crash
#   ⑥ test_graceful_no_sdk                   — langfuse=None in sys.modules → empty list, no crash
#   ⑦ test_empty_traces                      — no failed traces → empty regression suite
#   (② is an additional oracle not in the original docstring oracle map)
#
# C9 ADVERSARIAL REVIEW (different model class from implementer):
#   Implementer model: claude-opus-4-6 (Antigravity)
#   Reviewer model: claude-sonnet-4-6 (this session, 2026-06-04)
#   Review verdict: APPROVED — no security or correctness findings.
#   Review notes:
#     - Fail-open design is correct for a non-critical observability pipeline.
#     - traces_to_eval_cases asserts on "not-contains" / "unable" for the regression assert
#       value — this is intentionally broad to catch refusals; field is caller-configurable.
#     - _safe_str / _extract_error helpers are defensive and correct.
#   0 blocking findings.
#
# DEFERRED (named, not silently dropped):
#   * Live Langfuse integration test (requires real LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY;
#     gated on operator provisioning SP-00f PAT replacement path)
#   * Thumbs-down score filtering (fetch_traces only fetches "error"/"failure" tags;
#     score-based filtering needs Langfuse SDK score query support)
#   * DeepEval native intake (currently outputs Promptfoo YAML; DeepEval adapter is deferred)

task: SP-O3
title: "Production trace → eval regression pipeline — Langfuse integration (8 oracles)"
driver: V
phase: observability
run_from: repo_root

assertions:

  - id: spo3-module-importable
    description: >
      evals/trace_to_eval_pipeline.py imports cleanly and exposes the 4 public symbols.
    cmd: |
      uv run --extra dev python -c "
      from evals.trace_to_eval_pipeline import (
          LangfuseTraceClient,
          generate_regression_evals_from_traces,
          traces_to_eval_cases,
          write_regression_yaml,
      )
      print('OK: all 4 public symbols importable')
      "
    expect_exit: 0

  - id: spo3-not-theatre
    description: >
      The pipeline is not THEATRE — it does not return a hardcoded literal result.
      Verified by inspecting the source (no hardcoded YAML string in the module).
    cmd: |
      python3 -c "
      src = open('evals/trace_to_eval_pipeline.py').read()
      assert 'SP-O3-dummy' not in src, 'THEATRE: hardcoded dummy result found'
      assert 'hardcoded' not in src.lower(), 'THEATRE: hardcoded result found'
      print('OK: source is not THEATRE')
      "
    expect_exit: 0

  - id: spo3-8-hermetic-oracles
    description: >
      8 hermetic oracles: conversion, empty-input skip, YAML structure, full pipeline
      mock, no-credentials graceful, no-SDK graceful, empty-traces graceful.
    cmd: |
      OTEL_TRACES_EXPORTER=none OTEL_METRICS_EXPORTER=none \
      uv run --extra dev python -m pytest tests/unit/test_sp_o3_trace_pipeline.py \
        -q -p no:cacheprovider
    expect_exit: 0

proof:
  ci_workflow: .github/workflows/ci.yml
  artifact: >
    evals/trace_to_eval_pipeline.py: real Langfuse SDK integration (replaces THEATRE stub).
    LangfuseTraceClient: lazy SDK init, graceful ImportError + missing-credential fallback.
    traces_to_eval_cases: Promptfoo-compatible YAML with not-contains assertion.
    generate_regression_evals_from_traces: public entrypoint, fail-open.
    tests/unit/test_sp_o3_trace_pipeline.py: 8 hermetic oracles via mock Langfuse client.
