# Acceptance — SP-R3 · vendor-lock fallback: SqliteFileCheckpointer contract
#
# C8: sha-pinned in audit/acceptance/SHA256SUMS (CODEOWNERS-guarded, 4-eyes / C10).
#
# PRD §6 SP-R3: "file checkpointer retained + contract-tested for ≥1 release;
#   checkpoint-schema contract test exists. Proof: contract-test run +
#   `import langgraph` after fallback."
#
# MECHANISM (hermetic — no network/docker):
#   app/adapters/inmemory/file_checkpointer.py:SqliteFileCheckpointer wraps
#   AsyncSqliteSaver (langgraph-checkpoint-sqlite) with an explicit aiosqlite
#   connection so the caller controls the connection lifecycle. setup()/aclose()
#   manage the aiosqlite connection; build_saver() returns the saver after setup().
#
#   double-setup guard: setup() closes the prior connection before reconnecting
#   (B4 C9 fix — otherwise a double-setup leaks the first connection, keeping
#   the SQLite file locked on disk and preventing failover by another process).
#
#   event-loop constraint: AsyncSqliteSaver pins the running event loop at
#   construction time; setup() must be called on the same event loop as aput/aget
#   (documented in file_checkpointer.py; a process-restart scenario requires a
#   fresh setup() call in the new event loop).
#
# HONEST BOUNDARY:
#   ':memory:' loses state across connection teardown — NOT a valid failover config.
#   The durable-failover guarantee (F4b) requires a real file path. The
#   SpineState schema contract (F5) is the drift guard for the checkpoint payload.
#
# C9 REVIEW (Opus — different model class, 2026-06-04):
#   B1 (HIGH, FIXED): ALL original 7 tests used ':memory:'; I proved ':memory:'
#      loses state across aclose+setup — the headline failover claim was untested
#      and broken. F4b added: a real file-path cross-provider round-trip proves
#      durable failover (provider A writes, provider B on same file reads it back).
#   B4 (MEDIUM, FIXED): double-setup without aclose() left the first aiosqlite
#      connection open (leaked, SQLite file lock). setup() now closes prior conn
#      first; F7 regression test verifies the prior conn is closed.
#   B3 (MEDIUM, DOCUMENTED): AsyncSqliteSaver event-loop pinning — documented in
#      file_checkpointer.py; B3 is an architectural constraint of AsyncSqliteSaver,
#      not a bug in the wrapper.
#   C2 (LOW, FIXED): unused `import asyncio` removed from test file.

