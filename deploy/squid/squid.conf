# SP-00g: L7 hostname-allowlist egress proxy (Squid 6) — conf.d override.
#
# DEPLOYMENT NOTE:
#   This file is mounted as /etc/squid/conf.d/00-allowlist.conf (NOT as
#   /etc/squid/squid.conf). It runs first within the conf.d include block
#   (alphabetically before debian.conf) so our deny !allowed_hosts rule
#   fires BEFORE the default "http_access allow localnet" in debian.conf.
#   The main squid.conf's final "http_access deny all" remains the backstop.
#
#   Logging: the ubuntu/squid image's entrypoint already tails
#   /var/log/squid/access.log to stdout, so TCP_DENIED entries are visible
#   in `docker compose logs egress-proxy` without any extra access_log directive.
#   Adding a second access_log here would cause Squid 6 to fail to start.
#
# IMPORTANT — ALLOWLIST SYNC CONTRACT:
#   This file is the ENFORCEMENT layer for the network allowlist.
#   The canonical authoritative list lives in config/limits.yaml (modal_network_allowlist
#   extended with the full SP-00g set below). Any host added to or removed from
#   config/limits.yaml:modal_network_allowlist MUST be reflected here and vice-versa.
#   Drift between the two files constitutes a C16 trust-boundary violation.
#
# Scope: BUILD-phase egress for the execute/self-heal sandbox (SP-05/SP-00g/C16).
#   TEST phase uses network_mode=none (no proxy needed — PRD §206-208).
#   Production LiteLLM→Vertex gRPC traffic is NOT routed through this proxy
#   (gRPC ignores HTTP_PROXY; QUIC/HTTP3 bypasses Squid — deferred in SP-00g contract).
#
# Default-deny policy: traffic to any host NOT on the allowlist is rejected with TCP_DENIED.
# The "http_access deny !allowed_hosts" rule below enforces this; the final
# "http_access deny all" in the main squid.conf is the backstop.

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------
acl allowed_hosts dstdomain \
    api.github.com \
    github.com \
    codeload.github.com \
    .githubusercontent.com \
    .ghcr.io \
    .pkg.github.com \
    pypi.org \
    files.pythonhosted.org \
    pypi.python.org \
    registry.npmjs.org \
    .googleapis.com \
    .pkg.dev \
    .gcr.io \
    api.anthropic.com \
    api.telegram.org \
    api.trychroma.com \
    api.honcho.dev \
    openrouter.ai

# ---------------------------------------------------------------------------
# CONNECT / SSL port restrictions (belt + suspenders with default squid.conf)
# ---------------------------------------------------------------------------
acl SSL_ports port 443
http_access deny CONNECT !SSL_ports

# ---------------------------------------------------------------------------
# Default-deny: reject requests to hosts NOT on the allowlist.
#
# This runs before conf.d/debian.conf's "http_access allow localnet" so that
# clients on the bridge network cannot reach disallowed destinations.
# ---------------------------------------------------------------------------
http_access deny !allowed_hosts

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------
# Strip forwarded-for headers to avoid leaking internal topology.
forwarded_for delete
